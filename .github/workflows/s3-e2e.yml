name: S3 E2E Tests

on:
  push:
  pull_request:

jobs:
  s3-e2e:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres-version:
          - "14.23"
          - "18"
    steps:
    - uses: actions/checkout@v6
    - run: make fake-s3-server-persistent
    - name: Set node version
      uses: actions/setup-node@v6
      with:
        node-version-file: package.json
        cache: 'npm'
    - run: npm ci
    - run: make run-docker-postgres
      env:
        PG_VERSION: ${{ matrix.postgres-version }}
    - run: sudo apt-get install wait-for-it
    - name: E2E Test
      timeout-minutes: 10
      run: ./test/e2e/s3/run-tests.sh
    - name: Backend Logs
      if: always()
      run: "! [[ -f ./server.log ]] || cat ./server.log"
    - name: PostgreSQL logs
      if: always()
      run: docker logs odk-central-backend-dev-postgres || docker logs odk-central-backend-dev-postgres-ssl
