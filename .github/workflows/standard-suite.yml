name: Full Standard Test Suite

on:
  push:
  pull_request:

jobs:
  standard-tests:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres-version:
          - "14.23"
          - "18"
    steps:
    - uses: actions/checkout@v6
    - name: Set node version
      uses: actions/setup-node@v6
      with:
        node-version-file: package.json
        cache: 'npm'
    - run: make check-for-large-files
    - run: npm ci
    - run: make api-docs-lint
    - run: make run-docker-postgres
      env:
        PG_VERSION: ${{ matrix.postgres-version }}
    - run: make test
    - name: PostgreSQL logs
      if: always()
      run: docker logs odk-central-backend-dev-postgres || docker logs odk-central-backend-dev-postgres-ssl
